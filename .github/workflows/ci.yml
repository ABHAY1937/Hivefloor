name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Tests drive the harness in plain Node; the Electron binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Linux runners have Docker: build the default sandbox image (without the agent
      # CLIs, to keep CI fast) so the Dockerfile stays valid; the sandbox integration
      # test then runs against a real daemon.
      - if: runner.os == 'Linux'
        run: docker build --build-arg CLIS= -t hivefloor-agent:ci resources/sandbox
      - run: npm test
      - run: npm run eval
      - run: npm run audit:deps
      - run: npx electron-vite build
