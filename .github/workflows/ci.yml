name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Tests drive the harness in plain Node; the Electron binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # node-pty's macOS prebuilt spawn-helper can lose its exec bit in the npm tarball,
      # which makes every PTY spawn fail with posix_spawnp.
      - if: runner.os == 'macOS'
        run: ls -l node_modules/node-pty/prebuilds/darwin-*/ && chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run audit:deps
      - run: npx electron-vite build
