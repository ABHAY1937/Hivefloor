appId: dev.hivefloor.app
productName: Hivefloor
copyright: Copyright © 2026 Abhay
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/agents
    to: agents
  - from: resources/sandbox
    to: sandbox
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asarUnpack:
  - node_modules/node-pty/**
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
# Electron fuses, flipped in the binary at package time. runAsNode must stay on:
# agents (sim/llm/hive CLI) run via ELECTRON_RUN_AS_NODE with the bundled runtime.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
